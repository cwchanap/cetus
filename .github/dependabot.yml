version: 2

updates:
  # JS/TS workspace dependencies — Bun workspaces share one root bun.lock,
  # so updating at '/' covers apps/* and packages/* alike.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      js-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions versions in .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
