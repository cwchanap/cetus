coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure

# CI/dev scripts are infrastructure, not product code — keep them out of
# coverage reporting. Coverage is produced by the ROOT Vitest config (all
# test.projects aggregated into <repo>/coverage), so scripts still report
# under apps/web/scripts/** (e.g. scripts/validate-ice-slide-expedition.ts is
# loaded by a test import).
ignore:
  - apps/web/scripts/**
