coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure

# CI/dev scripts are infrastructure, not product code — keep them out of
# coverage reporting.
ignore:
  - scripts/**
